name: baaba_storage_hive
description: "Hive boxes (regular, typed, lazy) for baaba_storage_utils, with optional AES-256 encryption keyed from secure storage."
version: 3.0.0
homepage:
resolution: workspace

environment:
  # hive_ce_flutter 2.5 needs Flutter 3.44; Dart 3.11 comes from baaba_storage_utils.
  sdk: ^3.11.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  # The published core. In this repository the workspace root resolves it to
  # packages/baaba_storage_utils, so the two are developed and tested together;
  # publish the core first so this constraint exists on pub.dev.
  baaba_storage_utils: ^3.0.0
  # Direct dependency because baaba_storage_hive.dart re-exports Hive's types.
  # hive_ce_flutter re-exports hive_ce too, but the version we hand to
  # consumers should be one we pin ourselves rather than inherit.
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  # Tests seed and inspect secure storage through its mock; the package itself
  # reaches secure storage only through baaba_storage_utils.
  flutter_secure_storage: ^11.2.0

flutter:

name: baaba_storage_utils
description: "A unified Flutter storage package combining SharedPreferences, Hive, and Flutter Secure Storage with a clean, simple API."
version: 2.0.0
homepage:

environment:
  # flutter_secure_storage 11 needs Dart 3.8; hive_ce_flutter needs Flutter 3.44.
  sdk: ^3.8.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  # Direct dependency because baaba_storage_utils.dart re-exports Hive's types.
  # hive_ce_flutter re-exports hive_ce too, but the version we hand to
  # consumers should be one we pin ourselves rather than inherit.
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:

# Pub workspace root, never published. It lets the two packages resolve each
# other locally: baaba_storage_hive depends on baaba_storage_utils ^3.0.0 as
# published on pub.dev, and inside this workspace that constraint is satisfied
# by packages/baaba_storage_utils instead. Run `flutter pub get` once, here or
# in either package; there is one pubspec.lock and .dart_tool, at this root.
name: baaba_storage_workspace
publish_to: none

environment:
  sdk: ^3.11.0

workspace:
  - packages/baaba_storage_utils
  - packages/baaba_storage_hive
